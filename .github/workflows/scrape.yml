name: Scrape latest match data

on:
  schedule:
    - cron: "0 5 * * 1,4"   # Lunes y jueves 05:00 UTC = domingo y miércoles ~02:00 (hora Argentina, UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Scrapear Wikipedia
        run: |
          python -m src.scraping.wikipedia_source

      - name: Commit si hay partidos nuevos
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/matches_apertura_2026.json data/matches_clausura_2026.json
          git commit -m "Auto-scrape: partidos actualizados desde Wikipedia" || echo "No changes"
          git push origin HEAD:main
